      for (dk in defaults[part]) if (Object.prototype.hasOwnProperty.call(defaults[part], dk)) merged[dk] = defaults[part][dk];
      for (sk in v) if (Object.prototype.hasOwnProperty.call(v, sk)) merged[sk] = v[sk];

    if (Array.isArray(base)) return over || base.slice();

    var k;
    for (k in base) if (Object.prototype.hasOwnProperty.call(base, k)) out[k] = base[k];

    write(part, value);

      method: 'PUT',

      body: JSON.stringify(payload)

     booked them. The demo this grew from answered with the full booking list —
     names, phones, addresses — to anyone who asked for it. That is fine for two
     fake bookings and a privacy breach for a real business. */

  var server = null;       // { content, availability, reviews } as saved

  var reviewPool = [];     // Google's own five, read weekly; shown after Joe's
  var events = [];         // Joe's own diary. The owner's alone; never sent publicly.
  var sync = null;         // how the last read of his Google Calendar went
  var syncOn = false;      // whether a calendar is connected at all

      if (!Object.prototype.hasOwnProperty.call(taken, date)) continue;
      taken[date].forEach(function (slot) {

      .then(function (data) {

        remote = true;

        /* Only the admin page may ask for the real records, and not merely
           because the public one is refused them. When the owner is logged in
           on the same browser the request SUCCEEDS, and the line below replaces
           the closures the public payload just described with the handful of
           website bookings — so his own site showed every slot free while a
           customer's browser correctly showed them gone. The bug hid because a
           logged-out browser is the only one that ever sees it work. */

            ignore = d.ignore || [];
            reviewSync = d.reviewSync || null;

  function toIcs(bookings, opts) {

      'BEGIN:VCALENDAR', 'VERSION:2.0',
      'PRODID:-//Ethelium//Booking calendar//EN',
      'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'X-WR-CALNAME:' + icsEsc(name),
      'X-WR-TIMEZONE:' + (opts.tz || 'Australia/Sydney')

    bookings.slice().sort(function (a, b) {
      return a.date === b.date ? String(a.slot).localeCompare(b.slot)
                               : a.date.localeCompare(b.date);
    }).forEach(function (b) {
      var start = parseSlot(b.slot);
      if (start === null) return;
      var mins = slotMinutes(b.slot, slots);
      var desc = [
        b.name ? 'Customer: ' + b.name : '',
        b.phone ? 'Phone: ' + b.phone : '',
        b.address ? 'Address: ' + b.address : '',
        b.service ? 'Job: ' + b.service : '',
        b.notes ? 'Notes: ' + b.notes : ''

      lines.push('UID:' + icsEsc(b.id) + '@' + icsEsc(SLUG) + '.ethelium');
      lines.push('DTSTAMP:' + stamp);
      lines.push('DTSTART:' + icsTime(b.date, start));
      lines.push('DTEND:' + icsTime(b.date, start + mins));
      lines.push('SUMMARY:' + icsEsc((b.service || 'Booking') + (b.name ? ' — ' + b.name : '')));
      if (b.address) lines.push('LOCATION:' + icsEsc(b.address));
      if (desc) lines.push('DESCRIPTION:' + icsEsc(desc));
      lines.push('STATUS:' + (b.status === 'done' ? 'CONFIRMED'
                : b.status === 'confirmed' ? 'CONFIRMED' : 'TENTATIVE'));
      /* An hour's warning is the difference between a diary and a reminder. */
      lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:-PT1H',
                 'DESCRIPTION:' + icsEsc((b.service || 'Booking') +
                   (b.address ? ' — ' + b.address : '')), 'END:VALARM');
      lines.push('END:VEVENT');

  }

  function downloadIcs(text, filename) {
    try {

      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);

     a customer has no business knowing he has a dentist appointment. */
  function slotsFor(dateStr, avail, bookings) {
    var taken = {};
    bookings.forEach(function (b) { if (b.date === dateStr) taken[b.slot] = true; });
    var shut = (avail.blockedSlots || {})[dateStr] || [];
    return (avail.slots || []).map(function (s) {

    });

    if (!(avail.workDays || [])[isoDow(d)]) return { open: false, free: 0 };
    var free = slotsFor(dateStr, avail, bookings).filter(function (s) {
      return !s.taken && !s.blocked;

    reviewPool: function () { return reviewPool.slice(); },
    ymd: ymd, fromYmd: fromYmd, today: today, longDate: longDate,
    isoDow: isoDow, escapeHtml: escapeHtml,

  function runWhen(g) {
    var when;
    if (g.days.length === 1) when = E.longDate(g.from);
    else if (g.contiguous) when = E.longDate(g.from) + ' – ' + E.longDate(g.to);
    else {
      /* Every third Friday is not "the 4th to the 27th". Say how many days it
         actually takes and when the next one is, which is what he wants to know. */
      when = g.days.length + ' days, next ' + E.longDate(g.from);
    }
    return when + (g.slots.length ? ' at ' + g.slots.join(' & ') : ', all day');
  }

  function lines(s) {
    return String(s || '').split('\n').map(function (x) { return x.trim(); })
      .filter(function (x) { return x.length; });
  }

        field('about_lead_muted', 'Grey sentence after it', c.about_lead_muted, '', 2) +

  /* --- tab: availability ------------------------------------------------- */
  var availView;
  var availPick = null;   // the date whose times are open for editing, if any

  function ago(iso) {
    var then = Date.parse(iso);
    if (!then) return 'never';
    var mins = Math.round((Date.now() - then) / 60000);
    if (mins < 2) return 'just now';
    if (mins < 60) return mins + ' minutes ago';
    if (mins < 60 * 20) return Math.round(mins / 60) + ' hours ago';
    return 'on ' + E.longDate(new Date(then));
  }

  /* His Google Calendar, mirrored one way. Everything on it closes the matching
     times here; nothing here is ever written back to it. */
  function syncCard() {
    var st = E.sync();
    var on = E.syncOn();
    var mirrored = E.events().filter(function (e) { return e.source === 'ical'; });

    var line;
    if (!on && !mirrored.length) {
      line = 'Not connected yet. Once it is, everything in your Google Calendar closes the matching times on your website by itself, and you carry on using the calendar exactly as you do now.';
    } else if (st && st.ok) {
      line = 'Read ' + ago(st.at) + '. ' + st.entries + ' entries on your calendar, closing ' +
        st.blocks + (st.blocks === 1 ? ' time' : ' times') + ' here' +
        (st.skipped ? ', and ' + st.skipped + ' it could not make sense of' : '') + '.' +
        /* Looked at every quarter hour; only written down when it moves. */
        (st.changedAt && st.changedAt !== st.at ? ' Last change ' + ago(st.changedAt) + '.' : '');
    } else if (st && st.error) {
      line = 'The last try, ' + ago(st.at) + ', did not work: ' + st.error;
    } else if (mirrored.length) {
      line = mirrored.length + ' entries were brought over from your calendar.';
    } else {
      line = 'Connected. It has not been read yet — it goes and looks every half hour.';
    }

    return group('Your Google Calendar',
      '<p class="hint" style="margin:-4px 0 16px">' + esc(line) + '</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      (on ? '<button class="btn btn-s" type="button" id="sync-now" style="padding:8px 14px;font-size:12px">Read it now</button>' : '') +
      (mirrored.length ? '<button class="btn btn-d" type="button" id="sync-clear" style="padding:8px 14px;font-size:12px">Forget what it brought</button>' : '') +
      '</div>' +
      (on ? '<p class="hint" style="margin:14px 0 0">It reads your calendar every fifteen minutes on its own. Nothing here is ever written back to it, so your calendar stays yours.</p>' : '') +

      /* The escape hatch for entries that are labels rather than places to be.
         Sitting inside this card because it only means anything here. */
      '<div style="border-top:1px solid rgba(20,40,20,.1);margin-top:20px;padding-top:18px">' +
      '<label class="lbl">Things on your calendar that should NOT close your website</label>' +
      '<textarea class="fld" rows="4" data-f="ignore" placeholder="Wk&#10;T3&#10;T4">' +
        esc(E.ignore().join('\n')) + '</textarea>' +
      '<p class="hint">One per line. Anything on your calendar whose name <em>starts with</em> one of these is ignored, and those times stay open for customers. Everything else still closes your website as normal.</p>' +
      '<p class="hint" style="margin-top:-4px">Use it for the school week labels — <strong>Wk8</strong>, <strong>T3 Ends</strong> — which sit across whole weeks and would otherwise shut you for a fortnight. Leave the real ones, like a Book Fair, out of this box so they keep closing the day.</p>' +
      (st && st.ignored ? '<p class="hint"><strong>' + st.ignored + '</strong> ' +
        (st.ignored === 1 ? 'entry is' : 'entries are') + ' being ignored right now.</p>' : '') +
      '<button class="btn btn-p" type="button" id="ign-save" style="margin-top:6px">Save and re-read my calendar</button>' +
      '</div>');
  }

  function wireSyncCard(panel) {
    var now = document.getElementById('sync-now');
    if (now) now.addEventListener('click', function () {
      now.disabled = true;
      now.textContent = 'Reading…';
      E.syncNow().then(function (st) {
        toast('Read your calendar — ' + st.blocks + ' times closed');
        tabAvailability(panel);
      }, function (err) {
        now.disabled = false;
        now.textContent = 'Read it now';
        toast(err.message || 'Could not read it');
      });
    });

    var ign = document.getElementById('ign-save');
    if (ign) ign.addEventListener('click', function () {
      var box = panel.querySelector('[data-f="ignore"]');
      ign.disabled = true;
      ign.textContent = 'Saving…';
      E.saveIgnore(lines(box.value)).then(function () {
        toast('Saved — your calendar has been read again');
        tabAvailability(panel);
      }, function (err) {
        ign.disabled = false;
        ign.textContent = 'Save and re-read my calendar';
        toast(err.message || 'Could not save that');
      });
    });

    var clear = document.getElementById('sync-clear');
    if (clear) clear.addEventListener('click', function () {
      if (!confirm('Forget everything brought over from your Google Calendar? Those times open back up. Anything you typed in here yourself stays.')) return;
      E.clearImported().then(function () {
        toast('Forgotten');
        tabAvailability(panel);
      }, function (err) { toast(err.message || 'Could not do that'); });
    });
  }

  /* What Joe is doing instead of mowing. It closes the website exactly the way
     a manual block does, and unlike a manual block it has a name, so it reaches
     his phone calendar as something he can read. */
  function diaryCard() {
    var slots = E.get('availability').slots || [];
    var today = E.ymd(E.today());
    var upcoming = eventRuns().filter(function (g) { return g.to >= today; });
    var mirrored = upcoming.filter(function (g) { return g.source === 'ical'; });
    upcoming = upcoming.filter(function (g) { return g.source !== 'ical'; });

    /* Folded away: his round is sixty-odd repeating jobs and he does not need
       them listed above the box he types into. Shown, but not in the way. */
    var fromCal = mirrored.length
      ? '<details style="margin-bottom:20px">' +
        '<summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:#3f6a34">' +
        mirrored.length + ' from your Google Calendar</summary>' +
        '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:320px;overflow:auto">' +
        mirrored.map(function (g) {
          return '<div style="padding:10px 12px;border-radius:9px;background:#f4f6f2;' +
            'border:1px solid rgba(20,40,20,.08)">' +
            '<div style="font-size:12.5px;font-weight:600">' + esc(g.title) + '</div>' +
            '<div style="font-size:11.5px;color:rgba(23,26,23,.55);margin-top:2px">' + esc(runWhen(g)) + '</div>' +
            '</div>';
        }).join('') + '</div>' +
        '<p class="hint" style="margin:12px 0 0">These come from your calendar, so they change when you change them there.</p>' +
        '</details>'
      : '';

    var list = upcoming.length
      ? '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">' +
        upcoming.map(function (g) {
          return '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;' +
            'padding:12px 14px;border-radius:10px;background:#f4f6f2;border:1px solid rgba(20,40,20,.1)">' +
            '<div><div style="font-size:13.5px;font-weight:700">' + esc(g.title) + '</div>' +
            '<div style="font-size:12px;color:rgba(23,26,23,.6);margin-top:2px">' + esc(runWhen(g)) + '</div>' +
            (g.notes ? '<div style="font-size:11.5px;color:rgba(23,26,23,.5);margin-top:4px">' + esc(g.notes) + '</div>' : '') +
            '</div><button class="btn btn-d" type="button" data-ev="' + esc(g.id) + '" ' +
            'style="padding:7px 13px;font-size:12px;flex:none">Remove</button></div>';
        }).join('') + '</div>'
      : '<p class="hint" style="margin:-4px 0 20px">Nothing typed in here. Anything you put in closes the website for that day or that time, and turns up in your phone calendar next to the jobs.</p>';

    return group('Your own diary',
      fromCal +
      list +
      '<div style="border-top:1px solid rgba(20,40,20,.1);padding-top:18px">' +
      pair(cell('What is it?', '<input class="fld" data-f="title" placeholder="Dentist, day off, away">'),
           cell('When', timeSelect('evslot', slots, 'All day'))) +
      pair(cell('First day', '<input class="fld" type="date" data-f="date">'),
           cell('Last day', '<input class="fld" type="date" data-f="until">', 'Leave blank if it is just the one day.')) +
      cell('Notes', '<input class="fld" data-f="notes">') +
      '<div style="display:flex;gap:12px;align-items:center;margin-top:4px">' +
      '<button class="btn btn-p" type="button" id="ev-save">Add to my diary</button>' +
      '<span class="hint" style="margin:0">Closes the website, and shows up in your calendar.</span></div></div>');
  }

  function wireDiaryCard(panel) {
    wireTimeSelect('evslot');

    panel.querySelectorAll('[data-ev]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('Take this out of your diary? Those times open back up on your website.')) return;
        E.removeEvent(btn.getAttribute('data-ev')).then(function () {
          toast('Taken out of your diary');
          tabAvailability(panel);
        }, function (err) { toast(err.message || 'Could not remove that'); });
      });
    });

    var save = document.getElementById('ev-save');
    save.addEventListener('click', function () {
      var f = readFields(panel);
      if (!String(f.title || '').trim()) return toast('Give it a name first');
      if (!f.date) return toast('Pick the day it is on');
      save.disabled = true;
      E.createEvent({
        title: f.title, date: f.date, until: f.until,
        slot: readTime(f, 'evslot'), notes: f.notes
      }).then(function () {
        toast('Added to your diary');
        tabAvailability(panel);
      }, function (err) {
        save.disabled = false;
        toast(err.message || 'Could not add that');
      });
    });
  }

  function tabAvailability(panel) {
    var a = E.get('availability');
    var names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    panel.innerHTML =
      group('Days you work',
        '<p class="hint" style="margin:-8px 0 16px">Untick a day and it closes on the calendar every week.</p>' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px">' +
        names.map(function (n, i) {
          return '<label style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid rgba(20,40,20,.16);background:#fff;font-size:13px;font-weight:600;cursor:pointer">' +
            '<input type="checkbox" data-day="' + i + '"' + ((a.workDays || [])[i] ? ' checked' : '') + '> ' + n + '</label>';
        }).join('') + '</div>') +

      group('Start times you offer',
        field('slots', 'One per line', (a.slots || []).join('\n'),
          'These are the times a customer can pick on any day you are open.', 7) +
        field('leadDays', 'Days notice you need', String(a.leadDays || 0),
          'Put 1 and today is closed off; put 0 and someone can book you for today.')) +

      group('Block out days and times',
        '<p class="hint" style="margin:-8px 0 18px">Holidays, rain, a dentist appointment at two. Click a date to open it, then close the whole day or just the times you cannot make. Grey days are days you do not work.</p>' +
        '<div style="max-width:420px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
        '<div id="av-month" style="font-size:15px;font-weight:700"></div>' +
        '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-s" type="button" id="av-prev" style="padding:8px 14px">‹</button>' +
        '<button class="btn btn-s" type="button" id="av-next" style="padding:8px 14px">›</button></div></div>' +
        '<div class="cal-dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>' +
        '<div class="cal-days" id="av-days"></div>' +
        '<div id="av-day" style="margin-top:22px"></div></div>') +

      saveBar('Save my availability') +

      syncCard() +
      diaryCard();

    var t = E.today();
    if (!availView) {
      /* Start on the first month with a day still to come. Late in a month the
         current grid is entirely past, which looks like a dead calendar. */
      availView = new Date(t.getFullYear(), t.getMonth(), 1);
      var last = new Date(t.getFullYear(), t.getMonth() + 1, 0);
      if (E.ymd(last) === E.ymd(t)) availView = new Date(t.getFullYear(), t.getMonth() + 1, 1);
    }

    function draw() {
      var cur = E.get('availability');
      var bookings = E.get('bookings');
      document.getElementById('av-month').textContent = E.MON[availView.getMonth()] + ' ' + availView.getFullYear();
      document.getElementById('av-prev').disabled =
        (availView.getFullYear() < t.getFullYear()) ||
        (availView.getFullYear() === t.getFullYear() && availView.getMonth() <= t.getMonth());

      var host = document.getElementById('av-days');
      host.innerHTML = '';
      var first = new Date(availView.getFullYear(), availView.getMonth(), 1);
      var lead = E.isoDow(first);
      var days = new Date(availView.getFullYear(), availView.getMonth() + 1, 0).getDate();
      var cells = [];
      for (var i = 0; i < lead; i++) cells.push(null);
      for (var d = 1; d <= days; d++) cells.push(new Date(availView.getFullYear(), availView.getMonth(), d));
      while (cells.length % 7) cells.push(null);

      cells.forEach(function (dt) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cal-day';
        if (!dt) { b.className += ' blank'; b.disabled = true; host.appendChild(b); return; }
        var ds = E.ymd(dt);
        var label = document.createElement('span');
        label.textContent = dt.getDate();
        b.appendChild(label);

        var isPast = dt < t;
        var blocked = (cur.blocked || []).indexOf(ds) !== -1;
        var works = !!(cur.workDays || [])[E.isoDow(dt)];
        var booked = bookings.filter(function (x) { return x.date === ds; }).length;
        var shut = ((cur.blockedSlots || {})[ds] || []).length;
        /* A day off in his diary closes the day as surely as the switch does,
           so it wears the same colour; the panel below says which it was. */
        var evs = eventsOn(ds);
        var evAllDay = evs.filter(function (x) { return !x.slot; });
        var evTimed = evs.filter(function (x) { return !!x.slot; });
        var names = function (list) {
          return list.map(function (x) { return x.title; }).join(', ');
        };

        if (isPast) { b.className += ' past'; b.disabled = true; }
        else if (blocked || evAllDay.length) {
          b.className += ' blocked';
          b.title = evAllDay.length ? names(evAllDay) : 'Closed all day';
        }
        else if (!works) { b.className += ' off'; b.title = 'You do not work this day'; }
        /* A part-closed day gets a tint and nothing else. The cell already
           carries a "N booked" line; a second label would make it a paragraph. */
        else if (shut || evTimed.length) {
          b.className += ' partial';
          b.title = evTimed.length
            ? names(evTimed)
            : shut + (shut === 1 ? ' time' : ' times') + ' closed';
        }
        if (!isPast && ds === availPick) b.setAttribute('aria-pressed', 'true');

        if (booked && !isPast) {
          var m = document.createElement('span');
          m.className = 'mini';
          m.textContent = booked + ' booked';
          m.style.color = blocked ? '#9c3222' : '#3f6a34';
          b.appendChild(m);
        }

        if (!isPast) {
          b.addEventListener('click', function () {
            availPick = (availPick === ds ? null : ds);
            draw();
          });
        }
        host.appendChild(b);
      });
      drawDay();
    }

    /* Closing a whole day and closing one time are the same job at two sizes,
       so they share one panel under the calendar rather than two cards. Every
       toggle saves on the spot, which is what the day grid already did. */
    function drawDay() {
      var host = document.getElementById('av-day');
      if (!host) return;
      var cur = E.get('availability');

      if (!availPick) {
        host.innerHTML = '<p class="hint" style="margin:0">Pick a date above to close the whole day, or just the times on it you cannot make.</p>';
        return;
      }

      var ds = availPick;
      var dayShut = (cur.blocked || []).indexOf(ds) !== -1;
      var works = !!(cur.workDays || [])[E.isoDow(E.fromYmd(ds))];
      var shut = (cur.blockedSlots || {})[ds] || [];
      var booked = {};
      E.get('bookings').forEach(function (b) { if (b.date === ds) booked[b.slot] = true; });

      var dayEvents = eventsOn(ds);
      var allDay = dayEvents.filter(function (x) { return !x.slot; });
      var timed = {};
      dayEvents.forEach(function (x) { if (x.slot) timed[x.slot] = x.title; });
      var closedAllDay = dayShut || allDay.length > 0;

      var html = '<div style="border-top:1px solid rgba(20,40,20,.1);padding-top:18px">' +
        '<div style="font-size:14px;font-weight:700;margin-bottom:5px">' + esc(E.longDate(ds)) + '</div>' +
        '<p class="hint" style="margin:0 0 14px">' +
          (allDay.length
            ? esc(allDay.map(function (x) { return x.title; }).join(', ')) +
              ' \u2014 closed all day. Take it out of your diary below to open it back up.'
            : dayShut ? 'Closed all day. Nobody can book it.'
            : !works ? 'You do not work this weekday, so no times are offered on it.'
            : 'Click a time to close it. Closed times stop being offered on your website.') +
        '</p>' +
        /* No switch when the diary already closed it: two ways to shut one day
           is one way too many, and the diary entry is the one with a reason. */
        (allDay.length ? ''
          : '<button class="btn ' + (dayShut ? 'btn-s' : 'btn-d') + '" type="button" id="av-allday" ' +
            'style="padding:8px 14px;font-size:12px">' +
            (dayShut ? 'Open the whole day back up' : 'Close the whole day') + '</button>');

      if (!closedAllDay && works) {
        var slots = cur.slots || [];
        html += slots.length
          ? '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">' +
            slots.map(function (s) {
              var ev = timed[s];
              var off = !!ev || shut.indexOf(s) !== -1;
              return '<button class="btn btn-s" type="button" data-slot="' + esc(s) + '" ' +
                (ev ? 'disabled ' : '') +
                'aria-pressed="' + (off ? 'true' : 'false') + '" ' +
                'title="' + (ev ? esc(ev) + ' — remove it from your diary below'
                  : off ? 'Closed — click to open it back up' : 'Open — click to close it') + '" ' +
                'style="padding:8px 14px;font-size:12px' +
                (off ? ';background:#fbeae6;border-color:#e2b3a6;color:#9c3222;text-decoration:line-through' : '') +
                '">' + esc(s) +
                (ev ? ' · ' + esc(ev) : booked[s] ? ' · booked' : '') + '</button>';
            }).join('') + '</div>' +
            '<p class="hint" style="margin:12px 0 0">Closing a time somebody has already booked does not cancel their job. It only stops that slot being sold again if you cancel it.</p>'
          : '<p class="hint" style="margin:16px 0 0">You have no start times set above, so there is nothing to close.</p>';
      }
      host.innerHTML = html + '</div>';

      var allDayBtn = document.getElementById('av-allday');
      if (allDayBtn) allDayBtn.addEventListener('click', function () {
        var v = E.get('availability');
        var list = (v.blocked || []).slice();
        var at = list.indexOf(ds);
        if (at === -1) list.push(ds); else list.splice(at, 1);
        v.blocked = list;
        E.set('availability', v);
        draw();
        toast(at === -1 ? E.longDate(ds) + ' closed' : E.longDate(ds) + ' reopened');
      });

      host.querySelectorAll('[data-slot]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var s = btn.getAttribute('data-slot');
          var v = E.get('availability');
          /* Copied rather than mutated: E.get hands back a freshly merged
             object, and writing through a stale reference would drop days. */
          var map = {}, src = v.blockedSlots || {}, k;
          for (k in src) if (Object.prototype.hasOwnProperty.call(src, k)) map[k] = (src[k] || []).slice();
          var list = map[ds] || [];
          var at = list.indexOf(s);
          if (at === -1) list.push(s); else list.splice(at, 1);
          if (list.length) map[ds] = list; else delete map[ds];
          v.blockedSlots = map;
          E.set('availability', v);
          draw();
          toast(at === -1 ? s + ' closed on ' + E.longDate(ds) : s + ' opened back up');
        });
      });
    }

    document.getElementById('av-prev').addEventListener('click', function () {
      availView = new Date(availView.getFullYear(), availView.getMonth() - 1, 1); draw();
    });
    document.getElementById('av-next').addEventListener('click', function () {
      availView = new Date(availView.getFullYear(), availView.getMonth() + 1, 1); draw();
    });
    draw();
    wireSyncCard(panel);
    wireDiaryCard(panel);

    panel.querySelector('[data-save]').addEventListener('click', function () {
      var f = readFields(panel);
      var next = E.get('availability');
      next.workDays = names.map(function (_, i) {
        return panel.querySelector('[data-day="' + i + '"]').checked;
      });
      next.slots = lines(f.slots);
      var lead = parseInt(f.leadDays, 10);
      next.leadDays = isNaN(lead) || lead < 0 ? 0 : lead;
      E.set('availability', next);
      draw();
      toast('Saved — your calendar is updated');
    });
  }

  /* --- tab: bookings ----------------------------------------------------- */
  var STATUS = {
    'new': ['New', '#fff4d6', '#8a6300'],
    confirmed: ['Confirmed', '#e6f4e4', '#2f6a2c'],
    done: ['Done', '#eceef0', '#4a5560'],
    calendar: ['Your calendar', '#eef2f6', '#40566b']
  };

  /* Same shape as an Airbnb calendar export: one https:// URL the owner copies
     once into Google Calendar (or Apple, or whatever he uses) and it stays tied
     to the website from then on. The webcal:// button is the same URL with the
     scheme swapped, which is what makes an iPhone subscribe on a single tap. */
  function calendarCard(count) {
    var feed = E.feedUrl();
    var webcal = feed.replace(/^https?:/, 'webcal:');
    var live = E.isRemote();

    if (!feed) {
      return '<div class="card" style="margin-bottom:18px">' +
        '<div style="font-size:15px;font-weight:700">Sync your bookings to your calendar</div>' +
        '<p class="hint" style="margin-top:8px">Not available on this build.</p></div>';
    }

    return '<div class="card" style="margin-bottom:18px">' +
      '<div style="font-size:15px;font-weight:700;letter-spacing:-.01em">Sync your bookings to your calendar</div>' +
      '<p class="hint" style="margin-top:8px;margin-bottom:14px">Copy this link into Google Calendar (or Apple Calendar, or Outlook) once. ' +
      'From then on it stays tied to your website &mdash; every booking that comes in shows up in your normal calendar by itself, ' +
      'with the address, the phone number and the notes on it. Same idea as an Airbnb calendar link.</p>' +

      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">' +
      '<div style="flex:1;min-width:260px;padding:11px 13px;border-radius:9px;background:#f4f6f2;border:1px solid rgba(20,40,20,.1);' +
      'font:500 11.5px/1.5 ui-monospace,Menlo,monospace;color:rgba(23,26,23,.7);word-break:break-all" id="ics-url">' + esc(feed) + '</div>' +
      '<button class="btn btn-p" type="button" id="ics-copy">Copy link</button>' +
      '</div>' +

      '<details style="margin-bottom:12px">' +
      '<summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:#3f6a34">Where do I paste it?</summary>' +
      '<div class="hint" style="margin-top:10px;line-height:1.75">' +
      '<strong style="color:#1d2a1c">Google Calendar</strong> &mdash; open calendar.google.com on a computer, ' +
      'click the <em>+</em> next to &ldquo;Other calendars&rdquo; on the left, choose <em>From URL</em>, paste, <em>Add calendar</em>.<br>' +
      '<strong style="color:#1d2a1c">iPhone</strong> &mdash; just tap the button below on your phone.<br>' +
      '<strong style="color:#1d2a1c">Outlook</strong> &mdash; Add calendar → Subscribe from web → paste.' +
      '</div></details>' +

      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<a class="btn btn-s" href="' + esc(webcal) + '">Add straight to my iPhone</a>' +
      '<button class="btn btn-s" type="button" id="ics-dl"' + (count ? '' : ' disabled style="opacity:.45"') +
      '>Download a one-off file</button>' +
      '</div>' +

      '<p class="hint" style="margin-top:14px">' +
      (live
        ? 'Live. Bookings are shared across every device &mdash; your phone, the office laptop, your customer&rsquo;s phone.'
        : '<strong style="color:#9c3222">Offline.</strong> Cannot reach the booking server, so bookings are saved on this device only.') +
      '</p>' +
      '<p class="hint" style="margin-top:6px">Calendars decide for themselves how often to check &mdash; Google usually every few hours, ' +
      'iPhone about once a day unless you set the subscription to refresh every 5 minutes. It is not instant, same as an Airbnb sync.</p>' +
      '</div>';
  }

  function wireCalendarCard() {
    var dl = document.getElementById('ics-dl');
    if (dl && !dl.disabled) {
      dl.addEventListener('click', function () {
        var all = E.get('bookings');
        if (!all.length) return;
        var c = E.get('content');
        var ok = E.downloadIcs(E.toIcs(all, {
          name: (c.business || 'Bookings') + ' — bookings',
          slots: E.get('availability').slots,
          tz: E.defaults.tz
        }), E.slug + '-bookings.ics');
        toast(ok ? 'Calendar file downloaded' : 'Could not download on this browser');
      });
    }
    var copy = document.getElementById('ics-copy');
    if (copy) {
      copy.addEventListener('click', function () {
        var url = E.feedUrl();
        function fallback() {
          var el = document.getElementById('ics-url');
          var r = document.createRange();
          r.selectNodeContents(el);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
          toast('Link selected — press Cmd/Ctrl+C');
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, fallback);
        } else fallback();
      });
    }
  }

  /* Joe writing in a job he took on the phone. It is folded away behind a
     button because the list is what he opens this tab for; the form is the
     occasional errand, not the main event. */
  function addCard() {
    var a = E.get('availability');
    var svc = E.get('content').booking_services || [];
    var slots = a.slots || [];

    var svcInput = svc.length
      ? '<select class="fld" data-f="service">' +
        svc.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>'
      : '<input class="fld" data-f="service">';

    return '<div class="card" style="margin-bottom:18px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px">' +
      '<div style="font-size:15px;font-weight:700;letter-spacing:-.01em">Add a booking</div>' +
      '<button class="btn btn-s" type="button" id="bk-add-toggle" style="padding:8px 14px;font-size:12px">Write one in</button>' +
      '</div>' +
      '<div id="bk-add" hidden style="margin-top:20px">' +
      '<p class="hint" style="margin:-4px 0 18px">For a job you took over the phone. It closes that slot on your website straight away and turns up on your phone calendar with the rest.</p>' +
      pair(cell('Date', '<input class="fld" type="date" data-f="date">'),
           cell('Time', timeSelect('slot', slots, ''))) +
      pair(cell('Name', '<input class="fld" data-f="name">'),
           cell('Phone', '<input class="fld" data-f="phone" inputmode="tel">')) +
      cell('Address', '<input class="fld" data-f="address">') +
      pair(cell('What is the job?', svcInput),
           cell('Notes', '<input class="fld" data-f="notes">')) +
      '<div style="display:flex;gap:12px;align-items:center;margin-top:4px">' +
      '<button class="btn btn-p" type="button" id="bk-add-save">Add to the diary</button>' +
      '<span class="hint" style="margin:0">Saved as confirmed, and no email is sent.</span></div>' +
      '</div></div>';
  }

  function wireAddCard(panel) {
    var box = document.getElementById('bk-add');
    wireTimeSelect('slot');

    document.getElementById('bk-add-toggle').addEventListener('click', function () {
      box.hidden = !box.hidden;
      this.textContent = box.hidden ? 'Write one in' : 'Never mind';
      if (!box.hidden) box.querySelector('[data-f="date"]').focus();
    });

    document.getElementById('bk-add-save').addEventListener('click', function () {
      var f = readFields(box);
      var slot = readTime(f, 'slot');
      if (!f.date) return toast('Pick a date first');
      if (!slot) return toast('Give it a time');
      if (!String(f.name || '').trim()) return toast('Give it a name');

      var btn = this;
      btn.disabled = true;
      E.createBooking({
        date: f.date, slot: slot, name: f.name, phone: f.phone,
        address: f.address, service: f.service, notes: f.notes
      }).then(function () {
        toast('Booking added');
        tabBookings(panel);
        refreshCount();
      }, function (err) {
        btn.disabled = false;
        /* The unique index refusing a clash is the most likely landing here,
           and its message already says what he needs to do about it. */
        toast(err.message || 'Could not save that');
      });
    });
  }

  /* His round, as rows for the diary. It lives in the events table because the
     sync owns it and rewrites it whole every half hour, which is why it cannot
     carry a status he sets — but it is still work in his day, and hiding it in
     another tab meant the one list that should show everything showed one job
     out of two hundred. So it is shown here, plainly, and marked read-only. */
  function calendarJobs() {
    var today = E.ymd(E.today());
    var by = {}, out = [];
    E.events().forEach(function (e) {
      if (e.source !== 'ical' || e.date < today) return;
      var k = e.uid + '|' + e.date;
      if (!by[k]) { by[k] = { calendar: true, date: e.date, name: e.title, slots: [] }; out.push(by[k]); }
      if (e.slot && by[k].slots.indexOf(e.slot) === -1) by[k].slots.push(e.slot);
    });
    out.forEach(function (r) {
      r.slots.sort(function (a, b) { return slotOrder(a) - slotOrder(b); });
      r.slot = r.slots[0] || '';
    });
    return out;
  }

  function tabBookings(panel) {
    var list = E.get('bookings').slice().concat(calendarJobs()).sort(function (a, b) {
      if (a.date !== b.date) return a.date.localeCompare(b.date);
      return slotOrder(a.slot) - slotOrder(b.slot);
    });

    if (!list.length) {
      panel.innerHTML = addCard() + group('Bookings',
        '<p style="margin:0;font-size:13.5px;line-height:1.7;color:rgba(23,26,23,.6)">Nothing booked yet. When somebody books through the calendar on your website, they land here — name, phone, address, what they want done and when.</p>' +
        '<p class="hint">Try it: open your site, pick a day and book yourself in.</p>') +
        calendarCard(0);
      wireCalendarCard();
      wireAddCard(panel);
      return;
    }

    panel.innerHTML = addCard() + group('Bookings',
      '<table><thead><tr><th>When</th><th>Who</th><th>Where</th><th>Job</th><th>Status</th><th></th></tr></thead><tbody>' +
      list.map(function (b) {
        /* Read-only: it is his calendar's row, not the website's. The website
           may not confirm it, finish it or cancel it, and saying so in the row
           is better than a button that quietly does nothing. */
        if (b.calendar) {
          var c = STATUS.calendar;
          return '<tr>' +
            '<td><strong>' + esc(E.longDate(b.date)) + '</strong><br><span style="color:rgba(23,26,23,.55)">' +
              esc(b.slots.join(', ') || 'all day') + '</span></td>' +
            '<td><strong>' + esc(b.name) + '</strong></td>' +
            '<td style="color:rgba(23,26,23,.3)">' + '\u2014' + '</td>' +
            '<td style="color:rgba(23,26,23,.3)">' + '\u2014' + '</td>' +
            '<td><span class="pill" style="background:' + c[1] + ';color:' + c[2] + '">' + c[0] + '</span></td>' +
            '<td style="text-align:right;white-space:nowrap;font-size:11.5px;color:rgba(23,26,23,.4)">' +
              'change it in Google Calendar</td></tr>';
        }
        var s = STATUS[b.status] || STATUS['new'];
        return '<tr>' +
          '<td><strong>' + esc(E.longDate(b.date)) + '</strong><br><span style="color:rgba(23,26,23,.55)">' + esc(b.slot) + '</span></td>' +
          '<td><strong>' + esc(b.name) + '</strong><br><a href="tel:' + esc(String(b.phone).replace(/\s+/g, '')) + '">' + esc(b.phone) + '</a></td>' +
          '<td style="color:rgba(23,26,23,.7)">' + esc(b.address) + '</td>' +
          '<td style="color:rgba(23,26,23,.7)">' + esc(b.service) +
            (b.notes ? '<br><span style="font-size:11.5px;color:rgba(23,26,23,.5)">“' + esc(b.notes) + '”</span>' : '') + '</td>' +
          '<td><span class="pill" style="background:' + s[1] + ';color:' + s[2] + '">' + s[0] + '</span></td>' +
          '<td style="text-align:right;white-space:nowrap">' +
            (b.status !== 'confirmed' && b.status !== 'done'
              ? '<button class="btn btn-s" data-act="confirmed" data-id="' + esc(b.id) + '" style="padding:7px 13px;font-size:12px">Confirm</button> ' : '') +
            (b.status !== 'done'
              ? '<button class="btn btn-s" data-act="done" data-id="' + esc(b.id) + '" style="padding:7px 13px;font-size:12px">Done</button> ' : '') +
            '<button class="btn btn-d" data-act="delete" data-id="' + esc(b.id) + '" style="padding:7px 13px;font-size:12px">Cancel</button>' +
          '</td></tr>';
      }).join('') + '</tbody></table>') + calendarCard(list.length);

    wireCalendarCard();
    wireAddCard(panel);

    panel.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id'), act = btn.getAttribute('data-act');
        var done;
        if (act === 'delete') {
          if (!confirm('Cancel this booking? The time opens back up on your website, and it disappears from your phone calendar.')) return;
          done = E.removeBooking(id).then(function () { toast('Booking cancelled'); });
        } else {
          done = E.patchBooking(id, act).then(function () {
            toast(act === 'done' ? 'Marked done' : 'Booking confirmed');
          });
        }
        done.then(function () { tabBookings(panel); refreshCount(); });
      });
    });
  }

  function refreshCount() {
    var n = E.get('bookings').filter(function (b) { return b.status === 'new'; }).length;
    var el = document.getElementById('bk-count');
    if (el) el.textContent = n ? '(' + n + ')' : '';
  }

  /* --- tab: reviews ------------------------------------------------------ */
  function tabReviews(panel) {
    var r = E.get('reviews');

    var banner = r.connected
      ? '<div class="card" style="margin-bottom:18px;background:#eef5ec;border-color:#c3ddbd">' +
        '<div style="font-size:15px;font-weight:700">Your Google reviews</div>' +
        '<p style="margin:9px 0 0;font-size:13px;line-height:1.7;color:rgba(23,26,23,.68)">Your website is showing ' +
        '<strong>' + esc(r.rating) + ' stars from ' + esc(r.count) + ' reviews</strong>, copied from your real Google listing. ' +
        /* It used to say these refreshed from Google by themselves. They do
           not, and never did: there is no connection to Google here, only a
           copy taken by hand. Saying otherwise meant the number quietly went
           stale while he believed it was looking after itself. */
        (E.reviewsAuto()
          ? (function () {
              var rs = E.reviewSync();
              var line = 'Checked every Monday, straight from Google, so the number keeps itself right.';
              if (rs && rs.ok) {
                line += ' Last checked ' + ago(rs.at) + '.';
                if (rs.matched && rs.matched.name) {
                  line += ' Reading the listing for ' + rs.matched.name +
                    (rs.matched.address ? ', ' + rs.matched.address : '') + '.';
                }
              } else if (rs && rs.error) {
                line = 'The last check, ' + ago(rs.at) + ', did not work: ' + rs.error;
              }
              return esc(line) + '</p>' +
                '<p style="margin:10px 0 0"><button class="btn btn-s" type="button" id="rev-check" ' +
                'style="padding:8px 14px;font-size:12px">Check Google now</button></p>';
            })()
          : (function () {
              /* Nobody is checking Google for him, so the job is to make the
                 staleness impossible to miss rather than to pretend it is not
                 there. Amber after a month, because that is about how long it
                 takes a busy round to earn enough reviews to matter. */
              var touched = E.reviewTouched();
              var days = touched ? Math.floor((Date.now() - Date.parse(touched)) / 86400000) : null;
              var stale = days === null || days >= 30;
              var when = days === null ? 'It has not been updated since the site was built'
                : days === 0 ? 'You updated it today'
                : days === 1 ? 'You updated it yesterday'
                : 'You last updated it ' + days + ' days ago';
              return '<strong>This number does not update by itself.</strong> ' + esc(when) + '.</p>' +
                (stale
                  ? '<p style="margin:12px 0 0;padding:11px 13px;border-radius:9px;background:#fff6e6;' +
                    'border:1px solid #e6cf9e;font-size:12.5px;line-height:1.65;color:#6b4e12">' +
                    'Worth a look. Open your listing, read the rating and the number of reviews off it, ' +
                    'and type them into the two boxes below. Takes ten seconds, and an out-of-date number ' +
                    'sells you short.</p>'
                  : '');
            })()) +
        (r.url ? '<p style="margin:12px 0 0;font-size:13px"><a href="' + esc(r.url) + '" target="_blank" rel="noopener">Open my Google listing ↗</a></p>' : '') +
        '</div>'
      : '<div class="card" style="margin-bottom:18px;background:#fff6e8;border-color:#e8d4ac">' +
        '<div style="font-size:15px;font-weight:700">No Google listing found yet</div>' +
        '<p style="margin:9px 0 0;font-size:13px;line-height:1.7;color:rgba(23,26,23,.68)">We looked and could not find a Google Business listing for you, so the reviews section on your website is sitting empty rather than showing made-up ones. ' +
        'Getting you listed is the first job — it is free, it takes about ten minutes, and it is the single biggest thing you can do to get found. ' +
        'Once it is up, paste the link here and your real reviews flow onto the site by themselves.</p></div>';

    panel.innerHTML = banner +
      group('Google listing',
        field('url', 'Link to your Google listing', r.url,
          r.connected ? '' : 'Leave this blank until you have one — an empty section is better than an invented one.') +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" class="two">' +
        (E.reviewsAuto()
          ? '<div class="row"><label class="lbl">Star rating</label>' +
            '<div class="fld" style="background:#f4f6f2;color:rgba(23,26,23,.7)">' + esc(r.rating) + '</div></div>' +
            '<div class="row"><label class="lbl">Number of reviews</label>' +
            '<div class="fld" style="background:#f4f6f2;color:rgba(23,26,23,.7)">' + esc(r.count) + '</div></div>'
          : field('rating', 'Star rating', r.rating, 'Read from Google. Do not type a number you have not earned.') +
            field('count', 'Number of reviews', r.count)) + '</div>') +

      group('Reviews shown on your website',
        (r.items && r.items.length
          ? r.items.map(function (rv, i) {
              return '<div style="padding:18px 0;border-top:' + (i ? '1px solid rgba(20,40,20,.09)' : '0') + '">' +
                '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px">' +
                '<div style="font-size:12px;font-weight:700;color:rgba(23,26,23,.5)">REVIEW ' + (i + 1) + '</div>' +
                '<button class="btn btn-d" data-rm="' + i + '" style="padding:6px 13px;font-size:12px">Hide this one</button></div>' +
                field('rv' + i + '_name', 'Name', rv.name) +
                field('rv' + i + '_meta', 'Under their name', rv.meta) +
                field('rv' + i + '_when', 'When', rv.when) +
                field('rv' + i + '_text', 'What they wrote', rv.text, '', 4) +
                field('rv' + i + '_reply', 'Your reply (optional)', rv.reply, '', 2) + '</div>';
            }).join('')
          : '<p style="margin:0 0 4px;font-size:13.5px;line-height:1.7;color:rgba(23,26,23,.6)">Nothing here yet. Your website shows a quiet placeholder in this section until there is something real to put in it.</p>') +
        '<div style="margin-top:16px"><button class="btn btn-s" type="button" id="rv-add">Add a review</button></div>') +

      saveBar('Save my reviews');

    panel.querySelectorAll('[data-rm]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = +btn.getAttribute('data-rm');
        var cur = E.get('reviews');
        cur.items = (cur.items || []).filter(function (_, j) { return j !== i; });
        E.set('reviews', cur);
        tabReviews(panel);
        toast('Review hidden');
      });
    });

    document.getElementById('rv-add').addEventListener('click', function () {
      var cur = E.get('reviews');
      cur.items = (cur.items || []).concat([{ name: '', meta: '', when: '', text: '', reply: '' }]);
      E.set('reviews', cur);
      tabReviews(panel);
    });

    var revCheck = document.getElementById('rev-check');
    if (revCheck) revCheck.addEventListener('click', function () {
      revCheck.disabled = true;
      revCheck.textContent = 'Asking Google…';
      E.checkReviews().then(function (rs) {
        toast(rs.changed ? 'Now ' + rs.rating + ' from ' + rs.count + ' reviews'
                         : 'No change — still ' + rs.count + ' reviews');
        tabReviews(panel);
      }, function (err) {
        revCheck.disabled = false;
        revCheck.textContent = 'Check Google now';
        toast(err.message || 'Could not reach Google');
      });
    });

    panel.querySelector('[data-save]').addEventListener('click', function () {
      var f = readFields(panel);
      var next = E.get('reviews');
      next.url = f.url;
      /* Left exactly as they are while Google owns them: the boxes are not on
         the page, so there is nothing to read, and the server would refuse a
         stale number anyway. */
      if (!E.reviewsAuto()) {
        next.rating = f.rating;
        next.count = f.count;
      }
      next.items = (next.items || []).map(function (_, i) {
        return {
          name: f['rv' + i + '_name'], meta: f['rv' + i + '_meta'],
          when: f['rv' + i + '_when'], text: f['rv' + i + '_text'],
          reply: f['rv' + i + '_reply']
        };
      }).filter(function (rv) { return rv.text && rv.text.trim(); });
      /* The section only turns on when there is something real behind it. */
      next.connected = next.items.length > 0 && !!String(next.url || '').trim();
      E.set('reviews', next);
      tabReviews(panel);
      toast('Saved — your reviews are updated');
    });
  }

  /* --- shell ------------------------------------------------------------- */
  var TABS = { bookings: tabBookings, availability: tabAvailability, content: tabContent, reviews: tabReviews };

  /* Bookings first and open by default. The copy and the availability are set
     once and left alone; the diary is the reason he signs in. */
  var current = 'bookings';

  function show(name) {
    current = name;
    var panel = document.getElementById('panel');
    panel.innerHTML = '';
    document.querySelectorAll('.tab').forEach(function (t) {
      t.setAttribute('aria-selected', t.getAttribute('data-tab') === name ? 'true' : 'false');
    });
    (TABS[name] || tabBookings)(panel);
    refreshCount();
  }

  function boot() {
    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;
    E.syncBookings(true).then(function () {
      refreshCount();
      if (current === 'bookings') tabBookings(document.getElementById('panel'));
    });
    document.querySelectorAll('.tab').forEach(function (t) {
      t.addEventListener('click', function () { show(t.getAttribute('data-tab')); });
    });
    document.getElementById('sign-out').addEventListener('click', function () {
      signOut().then(function () { location.reload(); });
    });
    /* The demo had a "Start the demo over" card here that wiped the lot. On a
       live site that is a button which deletes a real diary, so it is gone for
       good; bookings are cancelled one at a time on the Bookings tab. */
    show('bookings');

    /* Somebody booking from their phone should appear here without a reload —
       that is the whole point of the bookings being shared. */
    setInterval(function () {
      if (document.hidden) return;
      var before = JSON.stringify(E.get('bookings'));
      E.syncBookings(true).then(function () {
        if (JSON.stringify(E.get('bookings')) === before) return;
        refreshCount();
        if (current === 'bookings') tabBookings(document.getElementById('panel'));
      });
    }, 20000);
  }

  document.getElementById('gate-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = document.getElementById('pw');
    var btn = ev.target.querySelector('button');
    if (btn) btn.disabled = true;
    E.login(pw.value).then(function () {
      boot();
    }).catch(function () {
      document.getElementById('gate-err').style.display = 'block';
      pw.value = '';
      pw.focus();
    }).then(function () { if (btn) btn.disabled = false; });
  });

  signedIn().then(function (yes) { if (yes) boot(); });
})();

</script>
</body>
</html>
